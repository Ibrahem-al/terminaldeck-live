<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · TerminalDeck</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#EDF2F4" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Served for any missing path, at any depth, so every URL here is absolute. */
      @font-face {
        font-family: 'Archivo Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2-variations');
      }
      :root {
        --paper: #edf2f4;
        --ink: #13233f;
        --pencil: #4e5d72;
        --magenta: #a4127a;
        --brass: #d8a956;
        --brass-edge: #a37a2e;
        --rule: rgb(19 35 63 / 0.2);
        --rule-strong: rgb(19 35 63 / 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        font-family: 'Archivo Variable', 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: 40px; }
      header { border-bottom: 1px solid var(--rule); }
      header .wrap { height: 68px; display: flex; align-items: center; }
      .mark {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 19px; font-weight: 650; font-stretch: 110%; letter-spacing: -0.01em;
        color: var(--ink); text-decoration: none; border-radius: 2px;
      }
      .mark i { display: block; width: 11px; height: 11px; transform: rotate(45deg); background: var(--brass); outline: 1px solid var(--brass-edge); }
      main { flex: 1; display: flex; align-items: center; }
      main .wrap { padding-block: 96px; }
      .label { font-size: 12px; font-stretch: 82%; font-weight: 560; letter-spacing: 0.015em; color: var(--pencil); }
      .datum { border-top: 1px solid var(--rule-strong); padding-top: 8px; max-width: 720px; }
      h1 {
        margin: 28px 0 0; font-size: 48px; line-height: 1.08; font-weight: 600; font-stretch: 116%;
        letter-spacing: -0.018em; text-wrap: balance;
      }
      p { margin: 16px 0 0; font-size: 18px; max-width: 36em; }
      .actions { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
      .btn {
        display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 6px;
        background: var(--brass); border: 1px solid var(--brass-edge); color: var(--ink);
        font-size: 18px; font-weight: 650; font-stretch: 104%; text-decoration: none;
      }
      .btn:hover { background: #e2b866; }
      .link {
        color: var(--ink); font-size: 18px; font-weight: 500; text-decoration: underline;
        text-decoration-color: var(--rule-strong); text-underline-offset: 4px;
      }
      .link:hover { text-decoration-color: var(--ink); }
      :focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; border-radius: 2px; }
      @media (max-width: 640px) {
        .wrap { padding-inline: 16px; }
        header .wrap { height: 60px; }
        main .wrap { padding-block: 64px; }
        h1 { font-size: 36px; }
        p { font-size: 17px; }
        .btn { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="mark" href="/" aria-label="TerminalDeck home"><i aria-hidden="true"></i>TerminalDeck</a>
      </div>
    </header>
    <main>
      <div class="wrap">
        <div class="datum"><span class="label">Error 404</span></div>
        <h1>This page is off the chart</h1>
        <p>There’s nothing at this address. It may have moved, or the link has a typo.</p>
        <div class="actions">
          <a class="btn" href="https://github.com/Ibrahem-al/TerminalDeck/releases/latest/download/TerminalDeck-Setup.exe">Download for Windows</a>
          <a class="link" href="/docs">Read the docs</a>
          <a class="link" href="/">Go to the home page</a>
        </div>
      </div>
    </main>
  </body>
</html>
